<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selvan Supermarket – Masala Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .product-card {border:1px solid #e0e0e0;border-radius:8px;padding:12px;margin:8px;}
    .product-img {width:100%;height:150px;object-fit:cover;border-radius:4px;}
    .price {font-weight:bold;color:#d9534f;}
    .old-price {text-decoration:line-through;color:#777;margin-right:8px;}
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">Masala Products – Individual Rates</h1>
    <div id="masala-grid" class="row"></div>
  </div>

  <script src="data.js"></script>
  <script>
    // Assume data.js defines PRODUCTS_DATA (or PRODUCTS)
    const products = typeof PRODUCTS_DATA !== 'undefined' ? PRODUCTS_DATA : (typeof PRODUCTS !== 'undefined' ? PRODUCTS : []);
    const masala = products.filter(p => p.category === 'spices');
    const grid = document.getElementById('masala-grid');
    masala.forEach(p => {
      const col = document.createElement('div');
      col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
      col.innerHTML = `
        <div class="product-card">
          <img src="${p.image}" onerror="this.src='https://images.unsplash.com/photo-1575247934848-4ef4e7ba15b7?auto=format&fit=crop&w=400&q=80'" class="product-img" alt="${p.name}" />
          <h5 class="mt-2">${p.name}</h5>
          <p class="mb-1">${p.brand}</p>
          <p class="mb-0">
            <span class="old-price">₹${p.mrp}</span>
            <span class="price">₹${p.salesPrice}</span>
          </p>
          ${p.offerLabel ? `<span class="badge bg-success">${p.offerLabel}</span>` : ''}
        </div>
      `;
      grid.appendChild(col);
    });
  </script>
</body>
</html>
